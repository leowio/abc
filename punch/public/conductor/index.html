<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="manifest" href="../manifest.json" />
    <title>Punch - Conductor</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="../lib/p5.js"></script>
    <script src="../socket.io/socket.io.js"></script>
  </head>
  <body>
    <div id="team-bar">
      <div id="team-blue" class="team-panel">
        <span class="team-dot blue-dot"></span>
        <span class="team-label">Blue</span>
        <span class="team-members" id="blue-members"></span>
      </div>
      <div id="team-red" class="team-panel">
        <span class="team-members" id="red-members"></span>
        <span class="team-label">Red</span>
        <span class="team-dot red-dot"></span>
      </div>
    </div>
    <div id="p5-canvas-container"></div>
    <script src="script.js"></script>
  </body>
</html>
